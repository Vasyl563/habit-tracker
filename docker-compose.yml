services:
  postgres:
    image: postgres:16-alpine
    container_name: habit_tracker_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: habit_tracker
    ports:
      # host 5433 -> container 5432 (5433 avoids clashing with a local Postgres)
      - "5433:5432"
    volumes:
      - habit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habit_tracker"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  habit_pg_data:
